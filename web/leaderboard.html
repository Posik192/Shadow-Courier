<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Courier — Līderu tabula</title>
    <!-- Favicon: pasta sūtījuma emodži kā SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <!-- Fonti no Google Fonts: Space Grotesk (virsraksti) + JetBrains Mono (skaitļi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animētais gaismas fons (CSS klase .gaisma-fons) -->
    <div class="gaisma-fons"></div>

    <nav>
        <a class="logo" href="leaderboard.html">SHADOW<span>COURIER</span></a>
        <div class="saites">
            <a href="leaderboard.html" class="aktiva">TOP 10</a>
            <a href="rules.html">Noteikumi</a>
        </div>
    </nav>

    <main>
        <header class="hero">
            <h1>LĪDERU <span class="akcents">TABULA</span></h1>
            <p>Labākie kurjeri, kas aiznesuši paketi cauri ēnām.</p>
        </header>

        <div class="tabula-kaste">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Spēlētājs</th>
                        <th>Līmenis</th>
                        <th>Punkti</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 1. vietai klase "first" — zelta krāsa un mirdzums (skat. style.css) -->
                    <tr class="first">
                        <td><span class="vieta">1</span></td>
                        <td>Anna</td>
                        <td>3</td>
                        <td class="punkti">900</td>
                    </tr>
                    <tr>
                        <td><span class="vieta">2</span></td>
                        <td>Jānis</td>
                        <td>3</td>
                        <td class="punkti">720</td>
                    </tr>
                    <tr>
                        <td><span class="vieta">3</span></td>
                        <td>Roberts</td>
                        <td>2</td>
                        <td class="punkti">580</td>
                    </tr>
                    <tr>
                        <td><span class="vieta">4</span></td>
                        <td>Elīna</td>
                        <td>2</td>
                        <td class="punkti">450</td>
                    </tr>
                    <tr>
                        <td><span class="vieta">5</span></td>
                        <td>Mārtiņš</td>
                        <td>1</td>
                        <td class="punkti">320</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
