# Render.com konfigurācija — lai serveri var izlikt internetā ar vienu klikšķi.
# Render to nolasa pats, kad veido jaunu Web Service no šī repozitorija.
services:
  - type: web
    name: shadow-courier
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    plan: free
